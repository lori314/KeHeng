<svg xmlns="http://www.w3.org/2000/svg" width="840" height="620" viewBox="0 0 840 620" role="img" aria-labelledby="title desc">
  <title id="title">科衡系统流程</title>
  <desc id="desc">企业名称经主体解析与迭代公开资料研究形成共享知识库；技术事实与生命周期、经营与财务事实共同用于技术—经营映射及证据断言，最终形成证据增强尽调报告。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#58748b"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "PingFang SC", sans-serif; font-size: 22px; fill: #18364c; text-anchor: middle; }
      .node { stroke-width: 1.5; }
      .link { fill: none; stroke: #58748b; stroke-width: 2.2; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="840" height="620" fill="#fff"/>

  <!-- Shared connector buses retain the original all-to-all fact inputs. -->
  <g class="link">
    <path d="M176 72 H212" marker-end="url(#arrow)"/>
    <path d="M462 72 H498" marker-end="url(#arrow)"/>
    <path d="M657 110 V150 H210"/>
    <path d="M210 150 V190" marker-end="url(#arrow)"/>
    <path d="M590 150 V190" marker-end="url(#arrow)"/>
    <path d="M210 270 V308 H590 V270"/>
    <path d="M210 308 V350" marker-end="url(#arrow)"/>
    <path d="M590 308 V350" marker-end="url(#arrow)"/>
    <path d="M210 430 V470 H590 V430"/>
    <path d="M420 470 V510" marker-end="url(#arrow)"/>
  </g>

  <g class="node">
    <rect x="24" y="34" width="152" height="76" rx="12" fill="#f3f6f8" stroke="#c7d3dc"/>
    <rect x="212" y="34" width="250" height="76" rx="12" fill="#f3f6f8" stroke="#c7d3dc"/>
    <rect x="498" y="34" width="318" height="76" rx="12" fill="#eef5fb" stroke="#a9c4db"/>
    <rect x="50" y="190" width="320" height="80" rx="12" fill="#eef5fb" stroke="#a9c4db"/>
    <rect x="430" y="190" width="320" height="80" rx="12" fill="#eef7f3" stroke="#b0cebf"/>
    <rect x="50" y="350" width="320" height="80" rx="12" fill="#f3f6f8" stroke="#c7d3dc"/>
    <rect x="430" y="350" width="320" height="80" rx="12" fill="#f3f6f8" stroke="#c7d3dc"/>
    <rect x="240" y="510" width="360" height="80" rx="12" fill="#183e55" stroke="#183e55"/>
  </g>

  <text x="100" y="80">企业名称</text>
  <text x="337" y="62"><tspan x="337">主体解析</tspan><tspan x="337" dy="30">迭代公开资料研究</tspan></text>
  <text x="657" y="62"><tspan x="657">共享知识库</tspan><tspan x="657" dy="30">来源记录</tspan></text>
  <text x="210" y="220"><tspan x="210">技术事实</tspan><tspan x="210" dy="30">技术生命周期</tspan></text>
  <text x="590" y="238">经营与财务事实</text>
  <text x="210" y="398">技术—经营映射</text>
  <text x="590" y="380"><tspan x="590">证据断言</tspan><tspan x="590" dy="30">来源关联</tspan></text>
  <text x="420" y="559" style="fill:#fff;font-weight:600;font-size:24px">证据增强尽调报告</text>
</svg>
